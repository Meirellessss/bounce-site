<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Agência Bounce">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#c8ff4d" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#c8ff4d" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e7ff8f"/>
      <stop offset="55%" stop-color="#b3f537"/>
      <stop offset="100%" stop-color="#5f8f0e"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="ballGlow"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1600" height="800" fill="#050505"/>
  <rect width="1600" height="800" fill="url(#glow)"/>
  <!-- soft outer ball halo -->
  <circle cx="1220" cy="290" r="90" fill="#c8ff4d" opacity="0.35" filter="url(#ballGlow)"/>
  <!-- Arc trails -->
  <path d="M 380 500 Q 640 260 890 490" stroke="#c8ff4d" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M 900 480 Q 1050 400 1180 320" stroke="#c8ff4d" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M 940 500 Q 1070 430 1180 350" stroke="#c8ff4d" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 970 520 Q 1080 460 1180 380" stroke="#c8ff4d" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Ball -->
  <circle cx="1220" cy="290" r="52" fill="url(#ball)"/>
  <!-- Wordmark BOUNCE italic bold -->
  <g font-family="'Bricolage Grotesque', 'Space Grotesk', Impact, sans-serif" font-weight="800" font-style="italic" fill="#f5f5f2" letter-spacing="-8">
    <text x="800" y="620" font-size="230" text-anchor="middle" transform="skewX(-8 800 620)">BOUNCE</text>
  </g>
  <!-- Baseline stroke -->
  <line x1="470" y1="700" x2="720" y2="700" stroke="#c8ff4d" stroke-width="6"/>
  <text x="800" y="705" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="14" fill="#c8ff4d" font-size="30">AGÊNCIA</text>
  <line x1="880" y1="700" x2="1130" y2="700" stroke="#c8ff4d" stroke-width="6"/>
</svg>
